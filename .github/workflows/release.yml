name: release

# Tag-driven: push a semver tag to cut a release. GoReleaser cross-compiles
# every target, builds the multi-arch image and creates the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release and upload assets
  packages: write # push images to ghcr.io

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pgsink
          POSTGRES_PASSWORD: pgsink
          POSTGRES_DB: pgsink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pgsink"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the changelog can be built

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Never ship a tag that does not pass its own tests, including the ones
      # that need a real PostgreSQL.
      - name: Test
        env:
          PGSINK_TEST_DSN: postgres://pgsink:pgsink@localhost:5432/pgsink
        run: go test ./...

      # Multi-arch image: QEMU emulates arm64, buildx drives the builds.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
