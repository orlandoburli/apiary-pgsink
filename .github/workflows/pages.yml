name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths: [README.md, docs/**, mkdocs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      # README is the home page, the same way Apiary's docs do it. Rewrite the
      # docs/ prefix out of its links so they resolve on the site.
      - name: Copy README into docs/
        run: |
          cp README.md docs/index.md
          cp COMMERCIAL.md docs/commercial.md
          cp LICENSE docs/LICENSE   # served as /LICENSE
          sed -i 's|](docs/|](|g' docs/index.md
          sed -i 's|](COMMERCIAL.md)|](commercial.md)|g' docs/index.md
          sed -i 's|](LICENSE)|](LICENSE)|g' docs/index.md
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
